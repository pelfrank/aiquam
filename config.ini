# ============================================================
# AIQUAM++ — file di configurazione
# ============================================================

# ------------------------------------------------------------
# [inference]  Parametri usati da prediction.py
# ------------------------------------------------------------
[inference]

# URL base del server OPeNDAP (NetCDF sorgente per l'inferenza)
URL = https://data.meteo.uniparthenope.it/opendap/wcm3/d03/archive/

# Ora del campionamento nel formato /HH:MM (usata per leggere CSV di date)
SAMPLE_HOUR = /10:00

# Numero di ore precedenti da caricare per costruire il vettore di features
START = 1
END   = 72

# Percorso del GeoJSON con le aree di allevamento
AREAS_FILE = banchi.geojson

# Directory dove vengono scritti i NetCDF di output
OUTPUT_DIR = output

# Directory locale con i file NetCDF già presenti su disco.
# Struttura attesa: <NC_ROOT>/YYYY/MM/DD/wcm3_d03_<datetime>.nc
# Se il file è trovato viene usato direttamente; altrimenti viene scaricato via OPeNDAP.
# Lascia vuoto per disabilitare (usa sempre OPeNDAP).
NC_ROOT = /storage/internal_02/fpeluso-data/wacomm_archive


# ------------------------------------------------------------
# [training]  Parametri usati da training_new.py
# ------------------------------------------------------------
[training]

# Directory radice dei campioni CSV già costruiti
DATASET_DIR = dataset

# Sotto-directory (anni) da includere — lista separata da virgole
DATASET_YEARS = 2021, 2023, 2024

# Numero di feature temporali per campione (colonne h_-71 … h_+00)
HOURS = 72

# Numero di classi di contaminazione
N_CLASSES = 4

# Etichette delle classi (formato: indice:etichetta, separati da virgole)
CLASS_LABELS = 0:0-67, 1:67-230, 2:230-4600, 3:>4600

# Directory dove vengono salvati i modelli addestrati
MODELS_DIR = models

# Seed per riproducibilità (SMOTE, train/test split)
RANDOM_SEED = 42

# Percentuale del dataset da usare come test set (es. 0.3 = 30%)
TEST_SIZE = 0.3

# --- KNN + DTW ---
KNN_DTW_N_NEIGHBORS      = 2
KNN_DTW_WARPING_WINDOW   = 5

# --- KNN sklearn ---
KNN_N_NEIGHBORS = 2

# --- CNN ---
CNN_EPOCHS     = 60
CNN_BATCH_SIZE = 72

# --- ResNet ---
RESNET_EPOCHS          = 100
RESNET_N_FEATURE_MAPS  = 32
# Batch size = min(n_train / RESNET_BATCH_DIVISOR, RESNET_MAX_BATCH)
RESNET_BATCH_DIVISOR   = 10
RESNET_MAX_BATCH       = 32
